  if(taps>=3){open=true;cookie.classList.add("open");SFX.crack();$("#taps").hidden=true;n++;$("#n").textContent=n;
    let f;do{f=pick(F);}while(f===lastF);lastF=f;const nums=[...new Set(Array.from({length:6},()=>1+Math.random()*49|0))].slice(0,5).sort((a,b)=>a-b);
    slip.innerHTML="";slip.append(f,el("small",{},`Lucky numbers: ${nums.join(" · ")}   ·   Lucky emoji: ${pick(LUCKY)}`));slip.classList.add("show");
    const r=cookie.getBoundingClientRect();flyEmoji(r.left+r.width/2,r.top+r.height/2,["🍪","✨","🥠","⭐"],12);setTimeout(()=>SFX.tada(),300);
    pipSay(box,pick(["The cookie has spoken! 🥠","Wow, that's a good one.","Pip's fortune said 'more snacks'. Accurate."]),"laugh");
    $("#again").hidden=false;$("#share").hidden=false;}}
function reset(){open=false;taps=0;cookie.className="cookie";slip.classList.remove("show");$("#taps").hidden=false;$("#again").hidden=true;$("#share").hidden=true;$("#copied").textContent="";SFX.boing();pipSay(box,"A fresh cookie! Tap tap tap.","happy");}
cookie.onclick=tap;$("#again").onclick=reset;
$("#share").onclick=async()=>{const text=`🥠 My fortune from Pip's Corner: "${lastF}"`;try{if(navigator.share){await navigator.share({text});return;}await navigator.clipboard.writeText(text);$("#copied").textContent="Copied! Paste it anywhere.";}catch(e){$("#copied").textContent=text;}};

</script>
