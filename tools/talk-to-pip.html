<style>

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}

  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));

.sign{display:inline-block;background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-weight:800;
  font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:4px;transform:rotate(-2deg);align-self:flex-start}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,64px);line-height:.95;margin:0;letter-spacing:-.02em;text-wrap:balance}

@keyframes tdrop{0%{transform:translateY(-40px);opacity:0}20%{opacity:1}70%,100%{transform:translateY(32px);opacity:1}}
.t-bar{animation:tbar .5s .2s cubic-bezier(.3,1.5,.6,1) both;transform-origin:0 50%}
@keyframes tbar{from{transform:scaleX(0)}}
.t-shades{animation:tshades .6s .1s cubic-bezier(.3,1.5,.6,1) both}
@keyframes tshades{from{transform:translateY(-60px)}}
.t-bounce{animation:tbounce .5s ease-in-out infinite alternate;transform-origin:60px 100px}
@keyframes tbounce{from{transform:translateY(0) scaleY(1)}to{transform:translateY(-18px) scaleY(1.05)}}

@keyframes tbub{from{transform:translateY(0);opacity:.9}to{transform:translateY(-40px);opacity:0}}

.t-clap{animation:tclap .25s ease-in-out infinite alternate}

.sound{font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:min(50vh,380px);min-height:160px;overflow-y:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:pop2 .3s cubic-bezier(.3,1.6,.6,1)}
.msg .txt{padding:10px 14px;border-radius:16px;line-height:1.4;overflow-wrap:anywhere}
.msg.me{align-self:flex-end}
.msg.me .txt{background:var(--hobby);color:#fff;border-bottom-right-radius:4px}
.msg.pip .txt{background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-weight:700;border-bottom-left-radius:4px}
.pip-av{width:44px;height:44px;flex:none}.pip-av svg{width:100%;height:100%}
.typing{display:flex;gap:4px;align-items:center;min-height:22px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sign-ink);opacity:.5;animation:p .9s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes pop2{from{transform:scale(.6);opacity:0}}

<script>
const SECTIONS = {
  Learn:{c:"var(--learn)", d:"A skill or subject"},
  Hobby:{c:"var(--hobby)", d:"Something just for fun"},
  Earn:{c:"var(--earn)", d:"A side income or business"},
  Recharge:{c:"var(--recharge)", d:"Rest from the noise"}
};
const STARTS = ["I'm bored","I feel stuck","I'm tired of the world","I want something new","I'm a student, what next?"];
const QUESTIONS = [
  {k:"mood", q:"How are you feeling right now?", opts:["Restless","Low on energy","Curious","Overwhelmed","Okay, just bored"]},
  {k:"time", q:"How much free time do you have each week?", opts:["Under 2 hours","2–5 hours","5–10 hours","10+ hours"]},
  {k:"budget", q:"What can you spend to get started?", opts:["Nothing","A little (under €50)","Some (under €300)","I can invest more"]},
  {k:"likes", q:"What do you enjoy? Pick any.", multi:true, opts:["Creating things","People & talking","Tech & computers","Food & cooking","Nature & moving","Words & stories","Numbers & puzzles","Helping others"]},
  {k:"style", q:"Do you prefer doing things alone or with others?", opts:["Alone","With a few people","In a group","Mix of both"]},
  {k:"goal", q:"Which of these sounds best right now?", multi:true, opts:["Learn something","A new hobby","Earn some money","Just feel better"]},
  {k:"about", q:"Tell me a bit about you.", text:true, hint:"Your background, culture, job or studies, where you live, anything you're good at."}
];

const app = document.getElementById("app");
let state = {start:null, answers:{}, i:0, result:null};
let ctl = null;

function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if (k==="style") e.style.cssText=v; else e.setAttribute(k,v);
  }
  for (const k of kids.flat()) if (k!=null) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}

function home(){
  app.replaceChildren(
    el("span",{class:"sign"},"Let it out"),
    el("h1",{},"Talk to Pip"),
    el("p",{class:"lede"},"Bored, stuck or tired of it all? Pick one and let it out. Pip is here, and nothing you do is saved."),
    el("div",{class:"tools"},
      el("button",{class:"tool",onclick:scribble},el("b",{},"✏️ Scribble"),el("small",{},"Draw any mess, then crumple it")),
      el("button",{class:"tool",onclick:vent},el("b",{},"💬 Vent box"),el("small",{},"Tell Pip everything, then burn it")),
      el("button",{class:"tool",onclick:scream},el("b",{},"😱 Scream"),el("small",{},"Hold the button. Let go.")),
      el("button",{class:"tool",onclick:laugh},el("b",{},"😂 Make me laugh"),el("small",{},"A joke or a silly challenge"))),
    el("p",{class:"foot"},"Want ideas for what to do next? Try ",el("a",{href:"four-directions.html"},"Four directions for you"),".")
  );
}

function ask(){
  const Q = QUESTIONS[state.i];
  let val = state.answers[Q.k] ?? (Q.multi?[]:"");
  const next = el("button",{class:"btn",onclick:()=>{state.answers[Q.k]=val; if(state.i<QUESTIONS.length-1){state.i++;ask();} else results();}}, state.i<QUESTIONS.length-1?"Next":"Show my directions");
  const update=()=>{ next.disabled = Q.text ? false : (Q.multi ? val.length===0 : !val); };
  let body;
  if (Q.text){
    const ta = el("textarea",{id:"q-"+Q.k,rows:"4",placeholder:Q.hint});
    ta.value = val; ta.addEventListener("input",()=>{val=ta.value;});
    body = ta;
  } else {
    body = el("div",{class:"chips"}, Q.opts.map(o=>{
      const b = el("button",{class:"chip","aria-pressed":String(Q.multi?val.includes(o):val===o)},o);
      b.onclick=()=>{
        if (Q.multi){ val = val.includes(o)?val.filter(x=>x!==o):[...val,o]; b.setAttribute("aria-pressed",String(val.includes(o))); }
        else { val=o; body.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b))); }
        update();
      };
      return b;
    }));
  }
  update();
  app.replaceChildren(
    el("div",{class:"progress"}, QUESTIONS.map((_,j)=>el("span",{class:j<=state.i?"on":""}))),
    el("span",{class:"step-label"},`Question ${state.i+1} of ${QUESTIONS.length}`),
    el("h2",{},Q.q),
    body,
    el("div",{class:"row"},
      el("button",{class:"btn ghost",onclick:()=>{state.answers[Q.k]=val; if(state.i>0){state.i--;ask();} else home();}},"Back"),
      next)
  );
}



function results(){ location.href="four-directions.html"; }

function showError(msg, retry=true){
  app.replaceChildren(
    el("h2",{},"Hmm, that didn't work"),
    el("p",{class:"status"},msg),
    el("div",{class:"row"},
      retry?el("button",{class:"btn",onclick:results},"Try again"):null,
      el("button",{class:"btn ghost",onclick:home},"Start over"))
  );
}

function showResult(){
  const r = state.result;
  app.replaceChildren(
    el("span",{class:"sign"},"Your directions"),
    el("h2",{},r.note||"Here are four ways forward."),
    el("div",{class:"cards"}, r.items.map(it=>{
      const s = SECTIONS[it.section] || SECTIONS.Learn;
      return el("article",{class:"card",style:`--c:${s.c}`},
        el("span",{class:"tag"},it.section||""),
        el("h3",{},it.title||""),
        el("p",{class:"why"},it.why||""),
        el("div",{class:"first"},el("b",{},"Next 15 min"),el("span",{},it.first_step||"")));
    })),
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:results},"Give me other ideas"),
      el("button",{class:"btn ghost",onclick:home},"Start over"))
  );
}


/* ---------- Sound (made in the browser, no mic) ---------- */
let AC=null, soundOn=true;
function ac(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){ AC=null; } return AC; }
function boing(){
  if(!soundOn||!ac()) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type="triangle"; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(880,t+.12); o.frequency.exponentialRampToValueAtTime(330,t+.3);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.35);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.4);
}
/* Three funny scream voices, picked at random each time */
function noiseBuf(){ const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return nb; }
function bonk(at){ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine";
  o.frequency.setValueAtTime(180,at); o.frequency.exponentialRampToValueAtTime(60,at+.18);
  g.gain.setValueAtTime(.5,at); g.gain.exponentialRampToValueAtTime(.0001,at+.25); o.connect(g).connect(AC.destination); o.start(at); o.stop(at+.3); }
const SCREAMS=[
 {name:"Panicked goat", toons:["🐐","🐑","🐄","🐓","😱","🙀","🤪"], make(){
   // bleating: buzzy voice chopped by a fast wobble, "MEH-EH-EH-EH"
   const t=AC.currentTime, out=AC.createGain(); out.gain.setValueAtTime(.0001,t); out.gain.exponentialRampToValueAtTime(.4,t+.08); out.connect(AC.destination);

const toons=[]; let toonLayer=null, toonRAF=0;
function toonLoop(){
  const W=innerWidth, H=innerHeight;
  for(let i=toons.length-1;i>=0;i--){ const c=toons[i]; c.t++;
    c.vy+=c.g; c.x+=c.vx+(c.fly?Math.sin(c.t/8+c.ph)*2.2:0); c.y+=c.vy; c.r+=c.vr;
    const sq=c.fly?1+Math.sin(c.t/4)*.12:1;
    c.el.style.transform=`translate(${c.x}px,${c.y}px) rotate(${c.r}deg) scale(${sq*c.sc},${c.sc/sq})`;
    if(c.y>H+120||c.x<-200||c.x>W+200||(c.y<-260&&c.vy<0&&c.t>60)){ c.el.remove(); toons.splice(i,1); } }
  toonRAF=toons.length?requestAnimationFrame(toonLoop):0;
}
function spawnToon(set, mode){
  if(reduce) return;
  if(!toonLayer||!toonLayer.isConnected){ toonLayer=el("div",{class:"toon-layer","aria-hidden":"true"}); document.body.append(toonLayer); }
  if(toons.length>45) return;
  const W=innerWidth, H=innerHeight, e=el("span",{class:"flytoon"},set[Math.random()*set.length|0]);
  const sz=36+Math.random()*48; e.style.fontSize=sz+"px"; toonLayer.append(e);
  let c={el:e,t:0,ph:Math.random()*6,sc:1,r:Math.random()*40-20,vr:(Math.random()-.5)*12};
  const m = mode || ["fly","toss","fall"][Math.random()*3|0];
  if(m==="fly"){ const left=Math.random()<.5; Object.assign(c,{fly:true,x:left?-80:W+20,y:Math.random()*H*.6,vx:(left?1:-1)*(2+Math.random()*3),vy:-1+Math.random()*2,g:.02,vr:(Math.random()-.5)*4}); if(!left) e.style.scale="-1 1"; }
  else if(m==="toss"){ Object.assign(c,{x:Math.random()*W,y:H+20,vx:(Math.random()-.5)*8,vy:-(13+Math.random()*9),g:.32}); }
  else { Object.assign(c,{x:Math.random()*(W-60),y:-100,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,g:.35}); }
  toons.push(c); if(!toonRAF) toonRAF=requestAnimationFrame(toonLoop);
}

const pick=a=>a[Math.random()*a.length|0];
function pipReply(text,total,added,last){
  const t=text.trim(), low=t.toLowerCase(), letters=t.replace(/[^a-zA-ZäöüÄÖÜß]/g,"");
  const caps=letters.length>4 && letters===letters.toUpperCase();
  if(MILESTONES[total] && added) return [MILESTONES[total],"jar"];
  if(added && total===added) return [pick(PIP.first),"ears"];
  if(added && total<=3) return [pick(PIP.warm),"bleep"];
  if(last && low===last) return [pick(PIP.same),"shades"];
  if(/\b(potato|biscuit|banana|muppet|noodle|pickle|walnut|sausage)\b/i.test(t)) return [pick(PIP.creative),"clap"];
  if(/\b(sorry|entschuldigung|sry)\b/i.test(t)) return [pick(PIP.sorry),"soap"];
  if(/\b(better|calm|relieved|done|thanks|thank you|danke)\b/i.test(t) && !added) return [pick(PIP.better),"clap"];
  if(caps) return [pick(PIP.shout),"ears"];
  if(added && /\b(you|u|du|dich)\b/i.test(t) && Math.random()<.6) return [pick(PIP.you),"faint"];
  if(!added) return t.endsWith("?")?[pick(PIP.ask),"rain"]:[pick(PIP.clean),"rain"];
  const tier = total<=1?["first","ears"]:total<=3?["warm","bleep"]:total<=7?["hot","shades"]:total<=15?["fire","faint"]:["legend","clap"];
  return [pick(PIP[tier[0]]).replace("{T}",total),tier[1]];
}

  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); submit(); } });
  const quick=el("div",{class:"chips"},["I'm so angry","Dare me","I feel better"].map(q=>el("button",{class:"chip",onclick:()=>submit(q)},q)));
  const burn=el("button",{class:"btn",onclick:()=>{
    const t=[...log.querySelectorAll(".msg.me .txt")].map(x=>x.textContent).join("  ");
    if(!t) return;
    const out=el("div",{class:"laugh"});
    [...t].slice(0,600).forEach((c,i)=>{out.append(el("span",{class:"ch",style:`--r:${(Math.random()*120-60)|0}deg;animation-delay:${Math.min(i*12,900)}ms`},c));});
    zone.replaceChildren(el("div",{class:"flames"}),out);
    burn.disabled=true;
    setTimeout(()=>{ log.replaceChildren(); zone.replaceChildren(log); burn.disabled=false; total=0; last="";
      counter.lastChild.textContent="0"; meter.firstChild.style.width="0"; rageName.textContent="Mood: calm-ish";
      pipSay("Gone. Burned to ashes. Feel lighter? Round two whenever you want.","shades",500); },reduce?300:2600);
  }},"Burn it");
  app.replaceChildren(
    el("span",{class:"sign"},"Vent box"),
    el("h2",{},"Say what you really want to say. Pip will answer."),
    el("div",{class:"row"},counter,rageName,soundToggle()),
    meter,
    zone, input, quick,
    el("div",{class:"row"},burn,el("button",{class:"btn ghost",onclick:home},"Back")),
    after("Feel lighter?"));
  pipSay("Hi, I'm Pip. Go on, let it all out. I can take it. Probably.","clap",400);
  ta.focus();
}

/* ---------- Scream: Pip reacts + record your own ---------- */
const PIPFACE={
 idle:{svg:()=>TOONS.clap.svg.replace(/class="t-clap2?"/g,""),line:"Go on. I'm ready. I think."},
 worried:{svg:()=>`<g>${body('<ellipse cx="60" cy="84" rx="6" ry="5" fill="#1B1E2B"/>','<circle cx="46" cy="62" r="7" fill="#fff" '+OUT+'/><circle cx="74" cy="62" r="7" fill="#fff" '+OUT+'/><circle cx="46" cy="63" r="3" fill="#1B1E2B"/><circle cx="74" cy="63" r="3" fill="#1B1E2B"/>')}</g>`,line:"Oh no. Oh no no no."},
 ears:{svg:()=>TOONS.ears.svg,line:"MY EARS!"},
 blown:{svg:()=>`<g class="t-shake">${body('<ellipse cx="60" cy="86" rx="14" ry="12" fill="#1B1E2B"/>','<path d="M40 60 l10 4 M80 60 l-10 4" '+OUT+'/>')}<path d="M30 40 l-14 -10 M50 32 l-6 -16 M72 32 l6 -16 M90 40 l14 -10" ${OUT}/></g>`,line:"AAAAAH! I'm screaming too now!"}
};
const PIPEND=[[0,"faint","Pip fainted. Very dramatic."],[0,"shades","Pip: Respect. That one had style."],[0,"clap","Standing ovation from Pip."],[0,"ears","Pip will need new ears."]];
let myScream=null, myFx="chipmunk";
function ownVoice(){
  if(!soundOn||!ac()||!myScream) return null;
  const t=AC.currentTime, out=AC.createGain(); out.gain.setValueAtTime(.0001,t); out.gain.exponentialRampToValueAtTime(1,t+.03); out.connect(AC.destination);
  const src=AC.createBufferSource(); src.buffer=myScream; src.loop=true;
  const rate={chipmunk:1.8,monster:.6,echo:1,robot:1,normal:1}[myFx]; src.playbackRate.value=rate;
  const extra=[]; let head=out;
  if(myFx==="echo"){ const d=AC.createDelay(1); d.delayTime.value=.28; const fb=AC.createGain(); fb.gain.value=.5; d.connect(fb).connect(d); d.connect(out); src.connect(d); }
  if(myFx==="robot"){ const rm=AC.createGain(); rm.gain.value=0; const o=AC.createOscillator(); o.frequency.value=55; o.connect(rm.gain); o.start(t); extra.push(o); rm.connect(out); head=rm; }
  src.connect(head); src.start(t);
  return { setLevel(n){ if(myFx!=="monster"&&myFx!=="robot") src.playbackRate.setTargetAtTime(rate*(1+Math.min(n,60)/200),AC.currentTime,.2); },
    stop(){ const e=AC.currentTime; out.gain.cancelScheduledValues(e); out.gain.setValueAtTime(out.gain.value,e);
      const tail=myFx==="echo"?1.6:.3; out.gain.exponentialRampToValueAtTime(.0001,e+tail); src.stop(e+tail+.05); extra.forEach(o=>o.stop(e+tail+.05)); } };
}
const OWN={name:"My own scream", toons:["😱","🤪","🙀","🤯","🎤","🦜","🐵"], make:ownVoice};
function scream(){
  const word=el("div",{class:"scream-word",style:"font-size:40px"},"Ready?");
  const kind=el("span",{class:"step-label"},"Scream type: surprise!");
  const btn=el("button",{class:"holdbtn"},"Hold to scream");
  const face=el("div",{class:"pip-face","aria-hidden":"true"}), say=el("p",{class:"pip-say"});
  const pip=el("div",{class:"pip-stage"},face,say);
  let state="";
  const setFace=(k,line,svg)=>{ if(state===k&&!line) return; state=line?k+"*":k; face.innerHTML=`<svg viewBox="0 0 120 120">${svg||PIPFACE[k].svg()}</svg>`; say.textContent=line||PIPFACE[k].line; };
  setFace("idle");
  let mode="surprise";
  // record your own
  const recBtn=el("button",{class:"btn"},"● Record (5 sec)");
  const recInfo=el("span",{class:"foot"},"Scream, laugh or shout into your mic. It stays on your device.");
  const fxRow=el("div",{class:"chips"},[["chipmunk","Chipmunk"],["monster","Monster"],["echo","Echo canyon"],["robot","Robot"],["normal","Just me"]].map(([k,l])=>{
    const b=el("button",{class:"chip","aria-pressed":String(k===myFx)},l);
    b.onclick=()=>{ myFx=k; fxRow.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b))); };
    return b; }));
  const ownBox=el("div",{class:"own"},el("div",{class:"row"},recBtn,recInfo),el("span",{class:"step-label"},"Make it funny"),fxRow);
  ownBox.hidden=true;
  let recording=false;
  recBtn.onclick=async()=>{
    if(recording) return;
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){ recInfo.textContent="Recording isn't possible here. It needs an https page or a file opened in Chrome or Edge on a computer. (no-media)"; return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ const why={NotAllowedError:"The mic is blocked. In the claude.ai preview it always is. On your own page, click the icon next to the web address and allow Microphone, then reload.",SecurityError:"This page isn't allowed to use the mic (preview or not https).",NotFoundError:"No microphone was found on this device.",NotReadableError:"Another app is using the microphone. Close it and try again."}[e&&e.name]||"The mic didn't start."; recInfo.textContent=why+" ("+((e&&e.name)||"error")+")"; return; }
    ac(); recording=true; const chunks=[]; const mr=new MediaRecorder(stream);
    mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); recording=false; recBtn.textContent="● Record again";
      try{ const buf=await new Blob(chunks,{type:mr.mimeType}).arrayBuffer(); myScream=await new Promise((res,rej)=>AC.decodeAudioData(buf,res,rej));
        recInfo.textContent="Got it! Now hold the big button."; setFace("worried","Was that YOU? Do it again, louder!"); }
      catch(e){ recInfo.textContent="That recording didn't work. Try once more."; } };
    mr.start(); let left=5; recBtn.textContent="Recording… 5";
    const iv=setInterval(()=>{ left--; if(left<=0||mr.state!=="recording"){ clearInterval(iv); if(mr.state==="recording") mr.stop(); } else recBtn.textContent="Recording… "+left; },1000);
    recBtn.onpointerup=null;
  };
  const modes=el("div",{class:"chips"},[["surprise","Surprise scream"],["own","My own scream"]].map(([k,l])=>{
    const b=el("button",{class:"chip","aria-pressed":String(k===mode)},l);
    b.onclick=()=>{ mode=k; modes.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b))); ownBox.hidden=k!=="own";
      kind.textContent=k==="own"?"Scream type: you!":"Scream type: surprise!"; };
    return b; }));
  let n=0, timer=null, voice=null, type=null;
  const start=e=>{ e.preventDefault(); if(timer) return; try{ if(e.pointerId!=null) btn.setPointerCapture(e.pointerId); }catch(_){}
    if(mode==="own"&&!myScream){ recInfo.textContent="Record your scream first (button above)."; setFace("worried","Record something first, then I'll panic."); return; }
    n=0; type=mode==="own"?OWN:pickScream(); voice=screamVoice(type);
    kind.textContent="Scream type: "+type.name;
    document.body.style.setProperty("--s",1); if(!reduce) document.body.classList.add("shake");
    btn.textContent="AAAAAAH"; setFace("worried");
    for(let i=0;i<3;i++) spawnToon(type.toons);
    timer=setInterval(()=>{ n++; const s=Math.min(n,60);
      word.textContent="A"+"A".repeat(Math.min(n,40))+"H"+"!".repeat(Math.floor(n/10));
      word.style.fontSize=(40+s*1.6)+"px"; voice?.setLevel(n);
      setFace(n>40?"blown":n>14?"ears":"worried");
      if(n%Math.max(1,5-Math.floor(n/12))===0) spawnToon(type.toons);
      document.body.style.setProperty("--s",Math.min(1+n/8,10));},60);};
  const stop=()=>{ if(!timer) return; clearInterval(timer); timer=null; voice?.stop(); voice=null;
    document.body.classList.remove("shake"); btn.textContent="Again!";
    word.textContent = n>40?"Legendary scream.":n>15?"That's the stuff.":"Louder next time!";
    const end = n>40?PIPEND[0]:n>15?pick(PIPEND.slice(1)):[0,"shades","That's it? I've heard louder sneezes."];
    setFace("end-"+end[1],end[2],TOONS[end[1]].svg);
    word.style.fontSize="40px"; confetti(Math.min(60+n*4,300)); dropAllToons(type.toons, Math.min(4+Math.floor(n/6),16)); };
  btn.addEventListener("pointerdown",start);
  ["pointerup","pointerleave","pointercancel"].forEach(t=>btn.addEventListener(t,stop));
  btn.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")start(e);});
  btn.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")stop();});
  app.replaceChildren(
    el("span",{class:"sign"},"Scream"),
    el("h2",{},"Hold the button as long as you need."),
    el("div",{class:"row"},soundToggle(),el("span",{class:"foot"},"Turn your volume up. On iPhone, turn off silent mode.")),
    modes, ownBox,
    pip, kind, word, btn,
    el("div",{class:"row"},el("button",{class:"btn ghost",onclick:home},"Back")),
    after());
}

function confetti(count){
  if(reduce) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#F2C230","#D2457A","#2F6FDB","#1E8C5A","#7A5AD6","#F28C28"];
  const ps=Array.from({length:count},()=>({x:innerWidth/2,y:innerHeight*0.6,vx:(Math.random()-.5)*16,vy:-Math.random()*18-6,s:Math.random()*8+4,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let f=0;(function tick(){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++f<120) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);})();
}

const JOKES=["I told my computer I needed a break. It said: 'No problem, I'll go to sleep.'","Why don't eggs tell jokes? They'd crack each other up.","I'm reading a book about anti-gravity. It's impossible to put down.","Why did the scarecrow win an award? He was outstanding in his field.","Parallel lines have so much in common. It's a shame they'll never meet.","I tried to catch fog yesterday. Mist.","Why don't skeletons fight each other? They don't have the guts.","My plants and I have a deal: I forget to water them, they forget to grow.","I asked the librarian for books about paranoia. She whispered: 'They're right behind you.'","Why did the bicycle fall over? It was two-tired.","What do you call a sleeping dinosaur? A dino-snore.","My phone battery and I have the same energy level at 4 pm: 3%.","I only know 25 letters of the alphabet. I don't know y.","Why do bees have sticky hair? Because they use honeycombs.","What did the ocean say to the beach? Nothing, it just waved.","I used to hate facial hair, but then it grew on me.","Why can't you trust stairs? They're always up to something.","Pip tried to start a hot-air balloon business. It never took off."];
const CHALLENGES=["Stand up and do your most dramatic slow-motion run to the kitchen and back.","Say the alphabet backwards. Out loud. With a fake opera voice.","Find something blue near you and give it a name and a backstory in 30 seconds.","Do 10 star jumps while saying 'I am a majestic starfish'.","Text a friend one single emoji and nothing else. See what happens.","Balance a spoon on your nose. Yes, really. Try for 60 seconds.","Narrate the next minute of your life like a nature documentary.","Make the silliest face you can and hold it for 10 seconds. Bonus: selfie.","Walk like a penguin to the nearest window and look outside like it's your first time seeing the world.","Write a 4-line poem about your left sock.","Speak only in questions for the next two minutes. Can you do it?","Dance to the next song you hear like nobody is watching. (Pip is. Pip approves.)"];
let lastJ="";
function laugh(){
  const out=el("div",{class:"laugh"},"Pick one and I'll cheer you up.");
  const go=kind=>{const pool=kind==="joke"?JOKES:CHALLENGES;let x;do{x=pick(pool);}while(x===lastJ&&pool.length>1);lastJ=x;out.textContent=x;try{boing();}catch(e){}if(kind==="joke"&&typeof confetti==="function")confetti(40);};
  app.replaceChildren(
    el("span",{class:"sign"},"Make me laugh"),
    el("h2",{},"A little silliness, coming up."),
    out,
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:()=>go("joke")},"Tell me a joke"),
      el("button",{class:"btn",onclick:()=>go("challenge")},"Give me a silly challenge"),
      el("button",{class:"btn ghost",onclick:home},"Back")),
    after());
}
