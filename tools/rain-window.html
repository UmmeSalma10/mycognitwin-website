<style>

 pop(){noise(.06,rnd(1800,3200),2,.5);tone(rnd(500,900),120,.07,"triangle",.15);},
 boing(){tone(220,880,.12,"triangle",.22);tone(880,330,.2,"triangle",.18,.12);},

/* ---- confetti + flying emoji ---- */
function confetti(x=innerWidth/2,y=innerHeight*.6,count=120){if(reduce)return;const cv=$("#fx")||document.body.appendChild(el("canvas",{id:"fx"}));const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;const cols=["#F2C230","#D2457A","#2F6FDB","#1E8C5A","#7A5AD6","#F28C28"];const ps=Array.from({length:count},()=>({x,y,vx:rnd(-9,9),vy:rnd(-16,-5),s:rnd(5,11),c:pick(cols),r:rnd(0,6)}));let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});if(++f<130)requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height);})();}
function flyEmoji(x,y,list,n=6,opts={}){if(reduce)return;for(let i=0;i<n;i++){const e=el("span",{class:"flyemo"},pick(list));e.style.left=x+"px";e.style.top=y+"px";if(opts.size)e.style.fontSize=opts.size+"px";document.body.append(e);const vx=rnd(-1,1)*(opts.spread||160),vy=-rnd(80,opts.up||220),rot=rnd(-180,180);e.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},{transform:`translate(calc(-50% + ${vx*.6}px),calc(-50% + ${vy}px)) rotate(${rot/2}deg) scale(1.1)`,opacity:1,offset:.5},{transform:`translate(calc(-50% + ${vx}px),calc(-50% + ${vy*.2+120}px)) rotate(${rot}deg) scale(.9)`,opacity:0}],{duration:opts.dur||1200+Math.random()*500,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>e.remove();}}

/* ---- rain-window ---- */

let W=0,H=0,d=1,fog=document.createElement("canvas"),fctx=fog.getContext("2d"),drops=[],racers=[],mine=-1,racing=false,wins=0,races=0,lights=[],t=0,rainNode=null,flashT=0;

R.forEach((r,i)=>{const b=el("button",{class:"chip racer",type:"button","aria-pressed":"false"},`${r.e} ${r.n}`);b.onclick=()=>{if(racing)return;mine=i;racerRow.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("#go").disabled=false;SFX.click();pipSay(box,pick([`${r.n}? Bold choice.`,`Go ${r.n}, go! 💪`,`${r.n} looks fast today.`]),"cool");};racerRow.append(b);});
function size(){const r=wrap.getBoundingClientRect();d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);fog.width=W;fog.height=H;fogUp(1);
  lights=Array.from({length:26},()=>({x:rnd(0,W),y:rnd(H*.25,H),r:rnd(12,38),c:pick(["255,200,120","255,150,90","140,190,255","255,230,170","200,160,255"]),tw:rnd(0,6)}));placeRacers();}

function spawn(){drops.push({x:rnd(0,W),y:rnd(-20,H*.7),r:rnd(1.5,4),v:0,stick:rnd(0,1)<.7,life:rnd(200,700)});}
for(let i=0;i<70;i++)spawn();
let wiping=false,last=null;
function wipe(e){const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;fctx.globalCompositeOperation="destination-out";fctx.lineCap="round";fctx.lineWidth=34;fctx.strokeStyle="rgba(0,0,0,1)";fctx.beginPath();fctx.moveTo(...(last||[x,y]));fctx.lineTo(x,y);fctx.stroke();last=[x,y];}

cv.addEventListener("pointermove",e=>{if(wiping)wipe(e);});
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{wiping=false;last=null;}));
function drawDrop(x,y,r,col){ctx.save();ctx.fillStyle=col||"rgba(220,235,255,.55)";ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y-r*1.8);ctx.quadraticCurveTo(x+r*1.2,y-r*.2,x+r,y+r*.3);ctx.arc(x,y+r*.3,r,0,Math.PI);ctx.quadraticCurveTo(x-r*1.2,y-r*.2,x,y-r*1.8);ctx.fill();ctx.stroke();ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(x-r*.35,y,r*.25,0,6.28);ctx.fill();ctx.restore();}
function frame(){t+=1/60;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#26324F");g.addColorStop(1,"#121829");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#0E1322";for(let i=0;i<8;i++){const bw=W/8,bh=H*(.3+((i*37)%5)/12);ctx.fillRect(i*bw,H-bh,bw-4,bh);}
  lights.forEach(l=>{const a=.35+.25*Math.sin(t*1.3+l.tw);const rg=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);rg.addColorStop(0,`rgba(${l.c},${a})`);rg.addColorStop(1,`rgba(${l.c},0)`);ctx.fillStyle=rg;ctx.beginPath();ctx.arc(l.x,l.y,l.r,0,6.28);ctx.fill();});
  if(flashT>0){ctx.fillStyle=`rgba(255,255,255,${flashT*.5})`;ctx.fillRect(0,0,W,H);flashT-=.03;}
  fctx.globalCompositeOperation="source-over";fctx.fillStyle="rgba(225,232,240,.0035)";fctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.62;ctx.drawImage(fog,0,0,W,H);ctx.globalAlpha=1;
  ctx.strokeStyle="rgba(200,220,255,.18)";ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<40;i++){const x=(i*53+t*400)%W,y=(i*97+t*900)%H;ctx.moveTo(x,y);ctx.lineTo(x-3,y+14);}ctx.stroke();
  drops.forEach(p=>{p.life--;if(!p.stick){p.v=Math.min(p.v+.04*p.r,3);p.y+=p.v;p.x+=Math.sin(p.y/20)*.2;}else if(Math.random()<.003*p.r)p.stick=false;drawDrop(p.x,p.y,p.r);});
  drops=drops.filter(p=>p.y<H+10&&p.life>0);while(drops.length<70)spawn();
  ctx.setLineDash([6,6]);ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H-26);ctx.lineTo(W,H-26);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="700 12px Inter,sans-serif";ctx.fillText("FINISH",8,H-32);
  racers.forEach((r,i)=>{if(racing&&!r.done){if(r.wait>0)r.wait--;else{r.v=Math.min(r.v+rnd(.02,.09),rnd(1.2,3.4));r.y+=r.v;r.x+=Math.sin(r.y/18+i)*.5;if(Math.random()<.012){r.wait=rnd(10,50)|0;r.v=0;}}
      r.trail.push([r.x,r.y]);if(r.trail.length>40)r.trail.shift();if(r.y>=H-26){r.done=true;finish(i);}}
    ctx.strokeStyle=r.c+"88";ctx.lineWidth=3;ctx.beginPath();r.trail.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
    drawDrop(r.x,r.y,7,r.c+"CC");ctx.font="18px serif";ctx.textAlign="center";ctx.fillText(r.e,r.x,r.y-18);if(i===mine){ctx.font="700 11px Inter,sans-serif";ctx.fillStyle="#fff";ctx.fillText("YOU",r.x,r.y-36);}ctx.textAlign="start";});
  requestAnimationFrame(frame);}
let winner=-1;
function finish(i){if(winner>=0)return;winner=i;racing=false;races++;$("#races").textContent=races;const r=R[i];
  if(i===mine){wins++;$("#wins").textContent=wins;SFX.tada();confetti(innerWidth/2,innerHeight*.4,120);pipSay(box,pick([`${r.e} ${r.n} wins! Pip makes the tea ☕`,`You picked the winner! ${r.n} is a legend.`,`Champion drop! ${r.e}🏆`]),"love");}
  else{SFX.sad();pipSay(box,pick([`${r.e} ${r.n} won this time. Rematch?`,`Ooh, so close! ${r.n} sneaked past.`,`${r.n} wins. Rain is unpredictable 🌧️`]),"sad");}
  $("#go").disabled=false;$("#go").textContent="Race again 🏁";}
$("#go").onclick=()=>{if(mine<0)return;placeRacers();winner=-1;racing=true;$("#go").disabled=true;SFX.ding();pipSay(box,"3… 2… 1… drip! 💧","wow");};
function rainSound(on){if(!ac())return;if(on&&!rainNode){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;s.loop=true;f.type="lowpass";f.frequency.value=1400;g.gain.value=.0001;s.connect(f).connect(g).connect(AC.destination);s.start();g.gain.exponentialRampToValueAtTime(.22,AC.currentTime+1);rainNode={s,g};}
  else if(!on&&rainNode){const n=rainNode;n.g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.6);setTimeout(()=>n.s.stop(),700);rainNode=null;}}
$("#rain").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",String(on));rainSound(on&&soundOn);pipSay(box,on?"Ahh. Rain sounds. So cosy 🫖":"Rain sound off.","sleepy");};
$("#thunder").onclick=()=>{flashT=1;if(!reduce){const f=el("div",{class:"flash"});document.body.append(f);setTimeout(()=>f.remove(),650);}noise(1.8,120,.6,.9,"lowpass",.25);noise(1.2,80,.5,.6,"lowpass",.6);pipSay(box,pick(["Eek! ⚡ Pip is hiding under the blanket.","BOOM! That was a big one.","Thunder! Count the seconds… 1… 2…"]),"wow");};
$("#wipe").onclick=()=>{fctx.clearRect(0,0,W,H);SFX.whoosh();pipSay(box,"Squeaky clean! The fog will come back slowly.","happy");};
addEventListener("resize",size);size();frame();
