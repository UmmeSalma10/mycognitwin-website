<style>
:root{--bg:#FFF8E8;--surface:#FFFFFF;--fg:#1B1E2B;--muted:#5D6275;--line:#E7DFCC;--sign:#F2C230;--pip:#F2C230;
--blue:#2F6FDB;--pink:#D2457A;--green:#1E8C5A;--purple:#7A5AD6;--orange:#F28C28;
--display:"Bricolage Grotesque","Inter",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161F;--surface:#20222E;--fg:#F1F1F5;--muted:#A9ADBD;--line:#34374A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161F;--surface:#20222E;--fg:#F1F1F5;--muted:#A9ADBD;--line:#34374A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh;
 background-image:radial-gradient(circle at 12% 8%,rgba(242,194,48,.18) 0 120px,transparent 121px),radial-gradient(circle at 92% 30%,rgba(210,69,122,.10) 0 90px,transparent 91px)}
a{color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:820px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 0}
.back{font-weight:600;text-decoration:none;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px}
.back:hover{border-color:var(--fg)}
.snd{font:600 14px/1 var(--body);background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:18px}
.sign{display:inline-block;align-self:flex-start;background:var(--sign);color:#1B1E2B;font:800 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:5px;transform:rotate(-2deg)}
h1{font:800 clamp(38px,8vw,60px)/.98 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 clamp(22px,5vw,30px)/1.1 var(--display);margin:0;text-wrap:balance}
p{margin:0}
.lede{color:var(--muted);font-size:18px;max-width:46ch}
button{font:inherit;cursor:pointer}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.y{background:var(--sign);color:#1B1E2B}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.stage{position:relative;background:var(--surface);border:2px solid var(--fg);border-radius:22px;box-shadow:6px 6px 0 var(--sign);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pipbox{display:flex;align-items:center;gap:12px}
.pipbox svg{width:84px;height:92px;flex:none}
.say{position:relative;background:var(--surface);border:2px solid var(--fg);border-radius:16px;padding:10px 14px;font:700 16px/1.3 var(--display);min-height:46px;display:flex;align-items:center}
.say::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--fg);border-left:0}
.say.pop{animation:sayp .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes sayp{from{transform:scale(.7);opacity:.2}}
.stat{font:800 15px/1 var(--display);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-variant-numeric:tabular-nums}
.foot{max-width:820px;margin:0 auto;padding:6px 16px 36px;color:var(--muted);font-size:14px;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.flyemo{position:fixed;z-index:61;pointer-events:none;font-size:28px;will-change:transform,opacity}
.pip-bob{animation:pbob 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pbob{50%{transform:translateY(-5px) rotate(-2deg)}}
.pip-jump{animation:pjump .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes pjump{40%{transform:translateY(-18px) scale(1.05)}}
.pip-shake{animation:pshake .12s 5}
@keyframes pshake{25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- pop-it ---- */

.wrapstage{padding:16px;background:var(--surface)}
.sheet{--b:#9CCBFF;display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:8px;transition:transform .5s cubic-bezier(.6,-0.4,.4,1.4),opacity .4s}
.sheet.out{transform:translateX(-110%) rotate(-6deg);opacity:0}
.sheet.in{transform:translateX(110%) rotate(6deg);opacity:0;transition:none}
.bub{aspect-ratio:1;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 32% 28%,#fff 0 12%,transparent 13%),radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--b) 70%,#fff),var(--b));box-shadow:inset -3px -5px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.08);transition:transform .12s;position:relative;touch-action:none}
.bub:hover{transform:scale(1.06)}
.bub.p{background:radial-gradient(circle,color-mix(in srgb,var(--b) 35%,transparent),transparent 70%);box-shadow:none;transform:scale(.82);cursor:default}
.bub.p::after{content:"";position:absolute;inset:28%;border:2px dashed color-mix(in srgb,var(--b) 70%,#000 10%);border-radius:40%;opacity:.5}
.bub.gold{--b:#FFD34D}
.bub .hid{position:absolute;inset:-6%;display:none}
.bub.p .hid{display:block;animation:peek .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes peek{from{transform:scale(0) rotate(-40deg)}}

<body>
<header class="bar"><a class="back" href="../index.html#pips-corner" data-back>← Pip's Corner</a><button class="snd" id="snd" type="button" aria-pressed="true">🔊 Sound on</button></header>

</main>

<script>
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s);
const pick=a=>a[Math.random()*a.length|0];
const rnd=(a,b)=>a+Math.random()*(b-a);
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="style")e.style.cssText=v;else e.setAttribute(k,v);}for(const k of kids.flat())if(k!=null)e.append(k.nodeType?k:document.createTextNode(k));return e;}
/* ---- sound, made in the browser ---- */
let AC=null,soundOn=true;
try{soundOn=localStorage.getItem("pip-sound")!=="off";}catch(e){}
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}return AC;}
function tone(f1,f2,dur,type="sine",vol=.2,delay=0){if(!soundOn||!ac())return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
let NB=null;function noise(dur,freq=1200,q=1,vol=.3,type="bandpass",delay=0){if(!soundOn||!ac())return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t,Math.random());s.stop(t+dur+.05);}
const SFX={
 pop(){noise(.06,rnd(1800,3200),2,.5);tone(rnd(500,900),120,.07,"triangle",.15);},
 boing(){tone(220,880,.12,"triangle",.22);tone(880,330,.2,"triangle",.18,.12);},
 thud(){tone(140,50,.18,"sine",.5);noise(.12,300,1,.35,"lowpass");},
 ding(){tone(1320,1320,.5,"sine",.15);tone(1760,1760,.6,"sine",.1,.08);},
 tada(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.25,"triangle",.15,i*.09));},
 chomp(){noise(.05,900,1,.4,"bandpass");noise(.05,700,1,.35,"bandpass",.11);noise(.05,800,1,.3,"bandpass",.22);},
 whoosh(){noise(.35,600,.7,.25,"bandpass");},
 sad(){tone(440,330,.3,"triangle",.15);tone(330,220,.45,"triangle",.15,.28);},
 crack(){noise(.08,2400,3,.6);noise(.06,1500,2,.5,"bandpass",.05);tone(300,80,.1,"square",.08);},
 click(){tone(1800,1200,.03,"square",.06);}
};
function soundBtn(){const b=$("#snd");if(!b)return;const paint=()=>{b.textContent=soundOn?"🔊 Sound on":"🔇 Sound off";b.setAttribute("aria-pressed",String(soundOn));};paint();b.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("pip-sound",soundOn?"on":"off");}catch(e){}paint();if(soundOn){ac();SFX.click();}};}
/* ---- confetti + flying emoji ---- */
function confetti(x=innerWidth/2,y=innerHeight*.6,count=120){if(reduce)return;const cv=$("#fx")||document.body.appendChild(el("canvas",{id:"fx"}));const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;const cols=["#F2C230","#D2457A","#2F6FDB","#1E8C5A","#7A5AD6","#F28C28"];const ps=Array.from({length:count},()=>({x,y,vx:rnd(-9,9),vy:rnd(-16,-5),s:rnd(5,11),c:pick(cols),r:rnd(0,6)}));let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});if(++f<130)requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height);})();}
function flyEmoji(x,y,list,n=6,opts={}){if(reduce)return;for(let i=0;i<n;i++){const e=el("span",{class:"flyemo"},pick(list));e.style.left=x+"px";e.style.top=y+"px";if(opts.size)e.style.fontSize=opts.size+"px";document.body.append(e);const vx=rnd(-1,1)*(opts.spread||160),vy=-rnd(80,opts.up||220),rot=rnd(-180,180);e.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},{transform:`translate(calc(-50% + ${vx*.6}px),calc(-50% + ${vy}px)) rotate(${rot/2}deg) scale(1.1)`,opacity:1,offset:.5},{transform:`translate(calc(-50% + ${vx}px),calc(-50% + ${vy*.2+120}px)) rotate(${rot}deg) scale(.9)`,opacity:0}],{duration:opts.dur||1200+Math.random()*500,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>e.remove();}}
/* ---- Pip the cartoon ---- */
function pipSVG(mood="happy",color){const K='stroke="#1B1E2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';const body=color||(mood==="spicy"?"#F2704C":mood==="sour"?"#CFE36A":mood==="yuck"?"#B7D46A":"#F2C230");
const eyes={happy:'<circle cx="46" cy="64" r="6" fill="#1B1E2B"/><circle cx="74" cy="64" r="6" fill="#1B1E2B"/><circle cx="48" cy="62" r="2" fill="#fff"/><circle cx="76" cy="62" r="2" fill="#fff"/>',
 wow:'<circle cx="46" cy="62" r="10" fill="#fff" '+K+'/><circle cx="74" cy="62" r="10" fill="#fff" '+K+'/><circle cx="46" cy="63" r="4.5" fill="#1B1E2B"/><circle cx="74" cy="63" r="4.5" fill="#1B1E2B"/>',
 love:'<path d="M46 72 l-8-8 a4.5 4.5 0 0 1 8-5 a4.5 4.5 0 0 1 8 5z" fill="#E8466A" stroke="#1B1E2B" stroke-width="2"/><path d="M74 72 l-8-8 a4.5 4.5 0 0 1 8-5 a4.5 4.5 0 0 1 8 5z" fill="#E8466A" stroke="#1B1E2B" stroke-width="2"/>',
 laugh:'<path d="M39 66 q7 -9 14 0 M67 66 q7 -9 14 0" fill="none" '+K+'/>',
 sleepy:'<path d="M39 64 q7 5 14 0 M67 64 q7 5 14 0" fill="none" '+K+'/>',
 yuck:'<path d="M39 58 l12 6 l-12 6 M81 58 l-12 6 l12 6" fill="none" '+K+'/>',
 sad:'<circle cx="46" cy="65" r="5" fill="#1B1E2B"/><circle cx="74" cy="65" r="5" fill="#1B1E2B"/><path d="M38 55 l12 -4 M82 55 l-12 -4" '+K+'/><path d="M80 72 q3 8 0 10 q-3 -2 0 -10" fill="#6FB7F5"/>',
 cool:'<path d="M34 58 h52" '+K+'/><rect x="36" y="56" width="21" height="13" rx="4" fill="#1B1E2B"/><rect x="63" y="56" width="21" height="13" rx="4" fill="#1B1E2B"/>',
 dizzy:'<path d="M41 59 l10 10 M51 59 l-10 10 M69 59 l10 10 M79 59 l-10 10" '+K+'/>'};
const mouth={happy:'<path d="M48 82 q12 12 24 0" fill="none" '+K+'/>',wow:'<ellipse cx="60" cy="88" rx="8" ry="9" fill="#1B1E2B"/>',love:'<path d="M48 82 q12 12 24 0" fill="none" '+K+'/>',
 laugh:'<path d="M44 80 q16 22 32 0 z" fill="#1B1E2B" '+K+'/><path d="M52 90 q8 5 16 0" fill="#E8604C"/>',sleepy:'<circle cx="60" cy="88" r="4" fill="#1B1E2B"/><text x="86" y="40" font-family="sans-serif" font-weight="800" font-size="16" fill="#7A5AD6">z</text><text x="96" y="28" font-family="sans-serif" font-weight="800" font-size="12" fill="#7A5AD6">z</text>',
 yuck:'<path d="M46 88 q14 -8 28 0" fill="none" '+K+'/><path d="M56 88 q4 14 10 0" fill="#E8604C" stroke="#1B1E2B" stroke-width="2"/>',sad:'<path d="M48 90 q12 -10 24 0" fill="none" '+K+'/>',
 cool:'<path d="M50 84 q12 6 20 -2" fill="none" '+K+'/>',dizzy:'<path d="M48 88 q4 -5 8 0 q4 5 8 0 q4 -5 8 0" fill="none" '+K+'/>',
 chew:'<path d="M50 86 q5 -4 10 0 q5 4 10 0" fill="none" '+K+'/><ellipse cx="38" cy="82" rx="7" ry="6" fill="'+body+'" '+K+'/><ellipse cx="82" cy="82" rx="7" ry="6" fill="'+body+'" '+K+'/>',
 spicy:'<ellipse cx="60" cy="88" rx="9" ry="8" fill="#1B1E2B"/><path d="M60 96 q-6 10 0 20 q6 -10 0 -20" fill="#F28C28"/><path d="M30 34 q-4 -8 2 -14 M90 34 q4 -8 -2 -14" fill="none" stroke="#B9BDCB" stroke-width="3" stroke-linecap="round"/>',
 sour:'<circle cx="60" cy="88" r="4" fill="none" '+K+'/><path d="M39 64 l12 2 M81 64 l-12 2" '+K+'/>'};
const e=eyes[mood]||(mood==="chew"||mood==="spicy"?eyes.happy:mood==="sour"?"":eyes.happy);
return `<svg viewBox="0 0 120 130" aria-hidden="true"><ellipse cx="60" cy="122" rx="34" ry="5" fill="#000" opacity=".1"/><path d="M20 108 Q14 40 60 32 Q106 40 100 108 Z" fill="${body}" ${K}/><path d="M58 32 q-2 -14 8 -18" fill="none" ${K}/><circle cx="67" cy="13" r="5" fill="#E8604C" stroke="#1B1E2B" stroke-width="2.5"/>${mood==="sour"?eyes.sour||'':''}${e}${mood==="sour"?'<path d="M40 62 l12 3 M80 62 l-12 3" '+K+'/>':''}<ellipse cx="36" cy="80" rx="6" ry="4" fill="#F28C8C" opacity=".7"/><ellipse cx="84" cy="80" rx="6" ry="4" fill="#F28C8C" opacity=".7"/>${mouth[mood]||mouth.happy}</svg>`;}
function pipSay(box,text,mood){const s=box.querySelector(".say"),p=box.querySelector(".pipfig");if(mood&&p)p.innerHTML=pipSVG(mood);if(s){s.textContent=text;s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");}if(p){p.classList.remove("pip-jump");void p.offsetWidth;p.classList.add("pip-jump");}}
function pipBox(text,mood="happy"){const b=el("div",{class:"pipbox"},el("div",{class:"pipfig pip-bob"}),el("div",{class:"say",role:"status"},text));b.querySelector(".pipfig").innerHTML=pipSVG(mood);return b;}
document.querySelectorAll('[data-back]').forEach(a=>a.addEventListener('click',e=>{try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back();}}catch(err){}}));
soundBtn();
addEventListener("pointerdown",()=>ac(),{once:true});

/* ---- pop-it ---- */

const grid=$("#grid"),cnt=$("#cnt"),sheetN=$("#sheet");
const box=pipBox("Pop pop pop! Can you find me?","happy");$("#pip").replaceWith(box);
const COLORS=["#9CCBFF","#FFB3CF","#A8E6CF","#C9B6FF","#FFD8A8"];
let popped=0,sheetNo=1,left=0,rainbow=false,dragging=false;
const LINES=[[10,"Ten pops! You're warming up.","happy"],[25,"25! Your fingers are on fire 🔥","wow"],[50,"Fifty pops. Very satisfying, right?","laugh"],[100,"100 pops! Pop champion 🏆","cool"],[200,"200?! Pip bows to you.","love"],[400,"400. You are now a professional popper.","cool"]];
function cols(){return innerWidth<480?6:innerWidth<760?7:9;}
function build(){
  const c=cols(),r=innerWidth<480?8:6;grid.style.setProperty("--cols",c);
  grid.style.setProperty("--b",COLORS[(sheetNo-1)%COLORS.length]);grid.replaceChildren();
  const n=c*r,hide=Math.random()*n|0,gold=new Set([Math.random()*n|0,Math.random()*n|0]);left=n;
  for(let i=0;i<n;i++){const b=el("button",{class:"bub"+(gold.has(i)&&i!==hide?" gold":""),type:"button","aria-label":"Bubble"});
    if(rainbow)b.style.setProperty("--b",`hsl(${(i*23)%360} 85% 72%)`);
    if(i===hide){b.dataset.pip="1";const h=el("span",{class:"hid"});h.innerHTML=pipSVG("laugh");b.append(h);}
    grid.append(b);}
}
function pop(b,ev){
  if(b.classList.contains("p"))return;b.classList.add("p");popped++;left--;cnt.textContent=popped;SFX.pop();
  if(navigator.vibrate)navigator.vibrate(8);
  const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  if(b.dataset.pip){SFX.boing();flyEmoji(x,y,["💛","⭐","🎉","✨"],10);pipSay(box,"You found me! 🙈 Peekaboo!","laugh");}
  else if(b.classList.contains("gold")){SFX.ding();flyEmoji(x,y,["🌟","💰","✨"],8);pipSay(box,pick(["Golden bubble! Lucky you ✨","Ooh, shiny! A golden pop!","Gold! Make a wish 🌟"]),"wow");}
  else if(Math.random()<.05)flyEmoji(x,y,["💥","✨","💨"],3,{spread:60,up:80});
  const m=LINES.find(l=>l[0]===popped);if(m)pipSay(box,m[1],m[2]);
  if(left===0)next();
}
function next(){pipSay(box,pick(["Sheet done! Here comes a fresh one 📜","All popped! More bubbles incoming!","Wow. Another sheet? Of course!"]),"wow");confetti(innerWidth/2,innerHeight*.5,90);SFX.tada();
  setTimeout(()=>{grid.classList.add("out");setTimeout(()=>{sheetNo++;sheetN.textContent=sheetNo;build();grid.classList.remove("out");grid.classList.add("in");void grid.offsetWidth;grid.classList.remove("in");},reduce?0:500);},700);}
grid.addEventListener("pointerdown",e=>{const b=e.target.closest(".bub");dragging=true;if(b)pop(b,e);});
addEventListener("pointermove",e=>{if(!dragging)return;const t=document.elementFromPoint(e.clientX,e.clientY);const b=t&&t.closest&&t.closest(".bub");if(b&&grid.contains(b))pop(b,e);});
["pointerup","pointercancel"].forEach(t=>addEventListener(t,()=>dragging=false));
grid.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("bub")){e.preventDefault();pop(e.target,e);}});
$("#fresh").onclick=()=>{sheetNo++;sheetN.textContent=sheetNo;build();SFX.whoosh();pipSay(box,"Fresh sheet! Smell that new bubble smell.","happy");};
$("#mode").onclick=e=>{rainbow=!rainbow;e.currentTarget.setAttribute("aria-pressed",String(rainbow));build();pipSay(box,rainbow?"Rainbow bubbles! Fancy 🌈":"Back to classic bubbles.","love");};
let lastC=cols();addEventListener("resize",()=>{if(cols()!==lastC&&left===grid.children.length){lastC=cols();build();}});
build();

</script>
